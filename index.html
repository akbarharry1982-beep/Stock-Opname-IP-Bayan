<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Stock Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .readonly-cell { background-color: transparent; border: none; outline: none; width: 100%; cursor: default; }
        .table-input {
            width: 100%;
            border: 1px solid transparent;
            padding: 2px 4px;
            border-radius: 4px;
            outline: none;
            transition: all 0.2s;
        }
        .table-input:not([readonly]):focus {
            border-color: #3b82f6;
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
        .table-input:not([readonly]) {
            border-color: #d1d5db;
            background-color: #fff;
        }
        /* Menghilangkan panah pada input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="p-4 md:p-6 text-sm text-gray-800">

    <div class="max-w-6xl mx-auto space-y-4">
        
        <!-- Header Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row justify-between gap-4">
            <div class="flex-1 space-y-3">
                <h1 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Stock Opname
                </h1>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Tanggal/Jam</label>
                        <input type="text" id="dateTime" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg px-3 py-2" readonly>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Shift</label>
                        <select id="shift" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="DS">DS (Day Shift)</option>
                            <option value="NS">NS (Night Shift)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Pelaksana</label>
                        <input type="text" id="pelaksana" placeholder="Nama Pelaksana" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-gray-50/50">
                <div class="flex items-center gap-3">
                    <h2 class="font-semibold text-gray-700">Daftar Material</h2>
                    <span id="dbStatus" class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-medium bg-yellow-100 text-yellow-800">
                        <svg class="animate-spin w-3 h-3" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        Memuat Database...
                    </span>
                </div>
                
                <div class="relative w-full sm:w-64">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
                    </div>
                    <input type="text" id="scanInput" class="block w-full p-2 pl-9 text-sm text-gray-900 border border-blue-300 rounded-lg bg-blue-50 focus:ring-blue-500 focus:border-blue-500 font-medium placeholder-gray-400" placeholder="Scan/Input Material & Enter..." autocomplete="off">
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="text-[11px] text-gray-700 uppercase bg-gray-100 border-b">
                        <tr>
                            <th class="px-2 py-1.5 w-8 text-center">No</th>
                            <th class="px-2 py-1.5 min-w-[140px]">Material</th>
                            <th class="px-2 py-1.5 min-w-[250px]">Material Description</th>
                            <th class="px-2 py-1.5 min-w-[150px]">Mfr Part Number</th>
                            <th class="px-2 py-1.5 min-w-[90px]">SLoc</th>
                            <th class="px-2 py-1.5 min-w-[140px]">Storage Bin</th>
                            <th class="px-2 py-1.5 min-w-[110px]">Batch</th>
                            <th class="px-2 py-1.5 w-20 text-right bg-blue-50">Unres</th>
                            <th class="px-2 py-1.5 w-20 text-right bg-green-50">Aktual</th>
                            <th class="px-2 py-1.5 w-20 text-right font-bold">Selisih</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="text-[11px]">
                        <!-- Baris akan ditambahkan di sini -->
                    </tbody>
                </table>
            </div>
            
            <!-- Tombol Simpan di bawah tabel -->
        <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-end">
            <button id="btnSave" onclick="saveData()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
                <svg id="iconSave" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                <svg id="iconLoading" class="w-4 h-4 animate-spin hidden" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span id="textSave">Simpan Data</span>
            </button>
        </div>
    </div>

        <!-- History Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-4 border-b border-gray-100 bg-gray-50/50">
                <h2 class="font-semibold text-gray-700">Riwayat Data Tersimpan (10 Terbaru)</h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="text-[11px] text-gray-700 uppercase bg-gray-100 border-b">
                        <tr>
                            <th class="px-3 py-2 w-24">Waktu</th>
                            <th class="px-3 py-2">Material</th>
                            <th class="px-3 py-2">Pelaksana</th>
                            <th class="px-3 py-2 w-16">Shift</th>
                            <th class="px-3 py-2">Batch</th>
                            <th class="px-3 py-2 w-20 text-right">Unres</th>
                            <th class="px-3 py-2 w-20 text-right">Aktual</th>
                            <th class="px-3 py-2 w-20 text-right">Selisih</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody" class="text-[11px] text-gray-600 divide-y divide-gray-100">
                        <!-- Baris riwayat akan ditambahkan di sini -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-green-600 text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 z-50 pointer-events-none">
        <svg id="toastIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <div>
            <p id="toastTitle" class="font-bold text-sm">Berhasil Disimpan!</p>
            <p id="toastDesc" class="text-xs text-green-100">Data telah dikirim ke Google Sheets.</p>
        </div>
    </div>

    <script>
        // MASUKKAN URL DEPLOY WEB APP DARI GOOGLE APPS SCRIPT DI SINI!
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyIqAtmzpG_6hElsTKsG6MCIRlsQ6QJLoifpzTEyzgSj4sI13gFAk0LXaNl37meXcw/exec"; 

        // Konstanta Database Sheet MB52 (Harus Public)
        const DB_URL = "https://docs.google.com/spreadsheets/d/1MX28Ep8ZHH2Sznb5Tbj0xVzAw06p5-Ndw0C_kIBt86M/export?format=csv&gid=932596458";
        let mb52Data = [];

        function updateDateTime() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('dateTime').value = `${dateStr} ${timeStr}`;
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        function loadDatabase() {
            Papa.parse(DB_URL, {
                download: true,
                complete: function(results) {
                    const rows = results.data;
                    if(rows.length < 2) return;
                    
                    let headerIndex = 0;
                    for(let i=0; i<Math.min(10, rows.length); i++) {
                        let rowStr = rows[i].join("").toLowerCase();
                        if(rowStr.includes("material") && rowStr.includes("unrestricted")) {
                            headerIndex = i; break;
                        }
                    }

                    const headers = rows[headerIndex].map(h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, ''));
                    const mapCol = (keyword) => headers.findIndex(h => h.includes(keyword));

                    const colMat = mapCol("material");
                    const colDesc = mapCol("description");
                    const colMfr = mapCol("mfrpart");
                    const colSLoc = mapCol("sloc") !== -1 ? mapCol("sloc") : mapCol("storagelocation");
                    const colBin = mapCol("storagebin") !== -1 ? mapCol("storagebin") : mapCol("bin");
                    const colBatch = mapCol("batch");
                    const colUnres = mapCol("unrestricted");

                    mb52Data = [];
                    for(let i = headerIndex + 1; i < rows.length; i++) {
                        const row = rows[i];
                        if(!row[colMat] || row[colMat].trim() === "") continue;

                        mb52Data.push({
                            material: row[colMat].trim(),
                            materialNum: row[colMat].trim().replace(/^0+/, ''),
                            desc: colDesc !== -1 ? row[colDesc] : "",
                            mfr: colMfr !== -1 ? row[colMfr] : "",
                            sloc: colSLoc !== -1 ? row[colSLoc] : "",
                            bin: colBin !== -1 ? row[colBin] : "",
                            batch: colBatch !== -1 ? row[colBatch] : "",
                            unres: colUnres !== -1 ? (parseFloat(row[colUnres].replace(/,/g, '')) || 0) : 0
                        });
                    }

                    const statusBadge = document.getElementById('dbStatus');
                    statusBadge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-medium bg-green-100 text-green-800";
                    statusBadge.innerHTML = `<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> DB Terhubung (${mb52Data.length} item)`;
                },
                error: function(err) {
                    const statusBadge = document.getElementById('dbStatus');
                    statusBadge.className = "inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-medium bg-red-100 text-red-800";
                    statusBadge.innerHTML = `DB Gagal Dimuat`;
                    console.error("Gagal memuat DB:", err);
                }
            });
        }
        
        loadDatabase();
        loadHistory();

        function lookupMaterial(code) {
            const cleanCode = code.trim();
            const numCode = cleanCode.replace(/^0+/, '');
            return mb52Data.filter(item => item.material === cleanCode || item.materialNum === numCode);
        }

        const scanInput = document.getElementById('scanInput');
        scanInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const code = this.value.trim();
                if(code) {
                    // Kosongkan tabel terlebih dahulu (One-by-one mode)
                    document.getElementById('tableBody').innerHTML = '';
                    
                    const foundItems = lookupMaterial(code);
                    
                    if(foundItems.length > 0) {
                        // Jika material ditemukan, tambahkan semua lokasinya
                        foundItems.forEach(data => addEmptyRow(data.material, data));
                    } else {
                        // Jika tidak ada di DB, tetap buatkan 1 baris
                        addEmptyRow(code, null);
                    }
                    
                    // Kosongkan input dan fokus ke kolom aktual pertama
                    this.value = '';
                    const firstAktual = document.querySelector('.input-aktual');
                    if(firstAktual) {
                        firstAktual.focus();
                        firstAktual.select();
                    }
                }
            }
        });

        function addEmptyRow(materialCode = '', dbData = null) {
            const tbody = document.getElementById('tableBody');
            const rowCount = tbody.children.length + 1;
            const tr = document.createElement('tr');
            tr.className = "border-b hover:bg-gray-50 transition-colors group";
            
            tr.innerHTML = `
                <td class="px-2 py-1 text-center text-gray-500 font-medium">${rowCount}</td>
                <td class="px-2 py-1 align-top">
                    <div class="input-material readonly-cell whitespace-normal break-words min-w-[140px] font-mono font-semibold text-gray-800"></div>
                </td>
                <td class="px-2 py-1 align-top">
                    <div class="input-desc readonly-cell whitespace-normal break-words min-w-[250px] min-h-[20px] leading-tight text-gray-700"></div>
                </td>
                <td class="px-2 py-1 align-top">
                    <div class="input-mfr readonly-cell whitespace-normal break-words min-w-[150px] min-h-[20px] leading-tight text-gray-700"></div>
                </td>
                <td class="px-2 py-1 align-top">
                    <div class="input-sloc readonly-cell whitespace-normal break-words min-w-[90px] min-h-[20px] leading-tight text-gray-700"></div>
                </td>
                <td class="px-2 py-1 align-top">
                    <div class="input-bin readonly-cell whitespace-normal break-words min-w-[140px] min-h-[20px] leading-tight text-gray-700"></div>
                </td>
                <td class="px-2 py-1 align-top">
                    <div class="input-batch readonly-cell whitespace-normal break-words min-w-[110px] min-h-[20px] leading-tight text-gray-700"></div>
                </td>
                <td class="px-2 py-1 bg-blue-50 border-l border-r align-top">
                    <input type="number" class="table-input input-unres text-right readonly-cell font-bold" readonly tabindex="-1" value="0">
                </td>
                <td class="px-2 py-1 bg-green-50 align-top">
                    <input type="number" class="table-input input-aktual text-right font-bold text-blue-700" placeholder="0">
                </td>
                <td class="px-2 py-1 align-top">
                    <div class="cell-selisih text-right font-bold text-gray-400 min-h-[20px] flex items-center justify-end"></div>
                </td>
            `;
            
            tbody.appendChild(tr);

            // Set data text inside divs
            if (dbData) {
                tr.querySelector('.input-material').textContent = dbData.material;
                tr.querySelector('.input-desc').textContent = dbData.desc;
                tr.querySelector('.input-mfr').textContent = dbData.mfr;
                tr.querySelector('.input-sloc').textContent = dbData.sloc;
                tr.querySelector('.input-bin').textContent = dbData.bin;
                tr.querySelector('.input-batch').textContent = dbData.batch;
                tr.querySelector('.input-unres').value = dbData.unres;
            } else {
                tr.querySelector('.input-material').textContent = materialCode;
            }
            
            // Event Listeners for Calculation
            const aktualInput = tr.querySelector('.input-aktual');
            aktualInput.addEventListener('input', () => calculateSelisih(tr));
            aktualInput.addEventListener('focus', function() { this.select(); });
            
            calculateSelisih(tr);
            updateRowNumbers();
        }

        function calculateSelisih(row) {
            const unres = parseFloat(row.querySelector('.input-unres').value) || 0;
            const aktualInput = row.querySelector('.input-aktual').value;
            const selisihCell = row.querySelector('.cell-selisih');
            
            if(aktualInput === "") {
                // Jangan tampilkan apapun jika Aktual belum diisi
                selisihCell.textContent = "";
                selisihCell.className = 'cell-selisih text-right font-bold text-gray-400 min-h-[20px] flex items-center justify-end';
            } else {
                const aktual = parseFloat(aktualInput);
                const selisih = aktual - unres;
                
                selisihCell.textContent = selisih > 0 ? `+${selisih}` : selisih;
                
                if (selisih === 0) {
                    selisihCell.className = 'cell-selisih text-right font-bold text-green-600 min-h-[20px] flex items-center justify-end';
                } else if (selisih > 0) {
                    selisihCell.className = 'cell-selisih text-right font-bold text-green-600 bg-green-100 px-1 rounded min-h-[20px] flex items-center justify-end';
                } else {
                    selisihCell.className = 'cell-selisih text-right font-bold text-red-600 bg-red-100 px-1 rounded min-h-[20px] flex items-center justify-end';
                }
            }
        }

        function updateRowNumbers() {
            const trs = document.querySelectorAll('#tableBody tr');
            trs.forEach((tr, index) => {
                tr.children[0].textContent = index + 1;
            });
        }

        async function saveData() {
            const dateTime = document.getElementById('dateTime').value;
            const shift = document.getElementById('shift').value;
            const pelaksana = document.getElementById('pelaksana').value;
            
            const trs = document.querySelectorAll('#tableBody tr');
            if(trs.length === 0) return;

            let validItemCount = 0;
            let currentItemsToSave = [];
            
            trs.forEach((tr) => {
                const material = tr.querySelector('.input-material').textContent.trim();
                if(!material) return; 
                
                validItemCount++;
                const batch = tr.querySelector('.input-batch').textContent;
                const unres = tr.querySelector('.input-unres').value;
                const aktual = tr.querySelector('.input-aktual').value;
                const selisih = tr.querySelector('.cell-selisih').textContent;
                
                currentItemsToSave.push({
                    batch: batch,
                    unres: unres,
                    aktual: aktual,
                    selisih: selisih
                });
            });

            if(validItemCount === 0) return;
            
            const cleanMaterial = document.querySelector('.input-material').textContent.trim();
            const payload = {
                waktu: dateTime,
                shift: shift,
                pelaksana: pelaksana || 'Tanpa Nama',
                material: cleanMaterial,
                items: currentItemsToSave
            };

            // Mengubah state tombol menjadi Loading
            const btnSave = document.getElementById('btnSave');
            const iconSave = document.getElementById('iconSave');
            const iconLoading = document.getElementById('iconLoading');
            const textSave = document.getElementById('textSave');

            btnSave.disabled = true;
            iconSave.classList.add('hidden');
            iconLoading.classList.remove('hidden');
            textSave.textContent = "Mengirim...";

            try {
                // Jangan kirim ke database jika URL belum di set
                if (GAS_URL !== "URL_WEB_APP_ANDA_DISINI") {
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    if (result.status === 'error') {
                        throw new Error(result.message);
                    }
                } else {
                    console.warn("GAS URL belum diisi, mensimulasikan penyimpanan berhasil untuk testing.");
                    await new Promise(r => setTimeout(r, 1000)); // Simulasi loading
                }

                // Jika berhasil: simpan juga ke history lokal, reset tabel, tampilkan notifikasi sukses
                saveToHistory(dateTime, pelaksana, shift, currentItemsToSave, cleanMaterial);
                showToast("Berhasil Terkirim!", "Data telah dicatat ke Google Sheets & Riwayat lokal.", true);
                
                document.getElementById('tableBody').innerHTML = '';
                document.getElementById('scanInput').focus();

            } catch (error) {
                // Jika gagal: tampilkan notifikasi gagal
                console.error("Gagal mengirim data:", error);
                showToast("Gagal Mengirim!", "Terjadi kesalahan koneksi internet atau server.", false);
            } finally {
                // Kembalikan status tombol seperti semula
                btnSave.disabled = false;
                iconSave.classList.remove('hidden');
                iconLoading.classList.add('hidden');
                textSave.textContent = "Simpan Data";
            }
        }

        function showToast(title, desc, isSuccess) {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toastTitle');
            const toastDesc = document.getElementById('toastDesc');
            const toastIcon = document.getElementById('toastIcon');

            toastTitle.textContent = title;
            toastDesc.textContent = desc;

            if (isSuccess) {
                toast.classList.replace('bg-red-600', 'bg-green-600');
                toastDesc.classList.replace('text-red-100', 'text-green-100');
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>`;
            } else {
                toast.classList.replace('bg-green-600', 'bg-red-600');
                toastDesc.classList.replace('text-green-100', 'text-red-100');
                toastIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>`;
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 4000);
        }

        function saveToHistory(waktu, pelaksana, shift, items, title) {
            let history = JSON.parse(localStorage.getItem('so_history') || '[]');
            
            history.unshift({
                id: Date.now(),
                waktu: waktu,
                pelaksana: pelaksana || 'Tanpa Nama',
                shift: shift,
                items: items,
                title: title
            });

            // Membatasi array history hanya menyimpan 10 riwayat terbaru
            history = history.slice(0, 10);

            localStorage.setItem('so_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('so_history') || '[]');
            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = '';

            if(history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="px-3 py-4 text-center text-gray-400">Belum ada riwayat penyimpanan.</td></tr>`;
                return;
            }

            history.forEach((h) => {
                // Untuk menangani data lama yang mungkin belum menggunakan array items
                const itemsToRender = h.items || [{batch: '-', unres: '-', aktual: '-', selisih: '-'}];
                
                itemsToRender.forEach((item) => {
                    const tr = document.createElement('tr');
                    
                    // Mewarnai nilai selisih seperti pada tabel utama
                    let selisihHTML = item.selisih;
                    let sVal = parseFloat(item.selisih);
                    if(!isNaN(sVal)) {
                        if (sVal === 0) selisihHTML = `<span class="text-green-600 font-bold">${item.selisih}</span>`;
                        else if (sVal > 0) selisihHTML = `<span class="text-green-600 font-bold bg-green-100 px-1 rounded">${item.selisih}</span>`;
                        else if (sVal < 0) selisihHTML = `<span class="text-red-600 font-bold bg-red-100 px-1 rounded">${item.selisih}</span>`;
                    }

                    tr.innerHTML = `
                        <td class="px-3 py-2 whitespace-nowrap">${h.waktu}</td>
                        <td class="px-3 py-2 font-bold text-blue-700">${h.title || '-'}</td>
                        <td class="px-3 py-2">${h.pelaksana}</td>
                        <td class="px-3 py-2">${h.shift}</td>
                        <td class="px-3 py-2 font-mono text-xs">${item.batch || '-'}</td>
                        <td class="px-3 py-2 text-right">${item.unres}</td>
                        <td class="px-3 py-2 text-right font-bold text-blue-700">${item.aktual}</td>
                        <td class="px-3 py-2 text-right">${selisihHTML}</td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }
    </script>
</body>
</html>
